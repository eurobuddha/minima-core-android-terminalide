plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.eurobuddha.terminalide'
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.terminalide"
        minSdk 28
        targetSdk 35
        // versionCode is minor*100 + patch, the family convention (0.2.9 -> 209, 0.4.3 -> 403).
        // This app broke it once: 0.2.1/0.2.2/0.2.3 shipped as 210/211/212 instead of 201/202/203,
        // which stranded the numbering — the correct code for a 0.2.x release is now BELOW what is
        // already installed, and versionCode can only go up. Going to 0.3.0 clears it: 300 follows
        // the convention and is a real increase over 212.
        versionCode 300
        versionName "0.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        // Minima family release key. Credentials come from ~/.gradle/gradle.properties
        // (outside every repo), so nothing secret is ever committed. On a machine without
        // those props this config stays empty and release falls back to debug signing.
        release {
            def ksFile = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign release with the debug keystore, matching the minima-core-android node app.
            // IPC is authorized by the MINIMA_ID token, not by signature, so this is sufficient
            // for sideloading. Swap to a dedicated release keystore if uploading to Play.
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation files('libs/minimaapi.aar')
}